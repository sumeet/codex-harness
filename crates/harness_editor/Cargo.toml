[package]
name = "harness_editor"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
editor = { path = "../editor", default-features = false, features = ["standalone-minimal"] }
gpui.workspace = true
grammars.workspace = true
harness_protocol.workspace = true
# Harness registers only the native grammars embedded below.
language = { path = "../language", default-features = false }
multi_buffer.workspace = true
settings.workspace = true
theme.workspace = true
theme_settings.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-json.workspace = true
tree-sitter-md.workspace = true
tree-sitter-rust.workspace = true
text.workspace = true
ui.workspace = true
vim = { path = "../vim", default-features = false }
